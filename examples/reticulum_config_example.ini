# Reticulum Configuration Example for SX1262 Interface
# 
# This is an example configuration for using the SX1262 LoRa driver as a 
# Reticulum interface. Copy the relevant section to your ~/.reticulum/config file.
#
# The SX1262 must be properly connected via SPI and GPIO pins on your Raspberry Pi.
# See the listener.py and tx.py examples for hardware connection details.

# ============================================================================
# SX1262 LoRa Interface Configuration
# ============================================================================
#
# To use this interface:
# 1. Ensure your SX1262 is connected and working (test with listener.py)
# 2. Install Reticulum: pip install rns
# 3. Add this section to ~/.reticulum/config
# 4. Restart Reticulum
#
# Notes:
# - sync_word: Can be 0x1424 (PRIVATE/MeshCore), 0x3444 (PUBLIC), or hex values
# - frequency: in Hz (e.g., 910525000 for 910.525 MHz)
# - bandwidth: in Hz (62500 = 62.5 kHz, 125000 = 125 kHz, etc.)
# - spreading_factor: 7-12 (higher = longer range, lower data rate)
# - coding_rate: 5-8 (4/5, 4/6, 4/7, 4/8)
# - All GPIO pins use BCM (Broadcom) numbering
#
# Performance Notes:
# - Default 910 MHz, SF7, 62.5 kHz gives ~1-2 km range in open area
# - Increase SF for longer range but slower data rate
# - Decrease BW for longer range but slower data rate
# ============================================================================

[[SX1262 LoRa Interface]]
  type = SX1262ReticulumInterface
  enabled = yes
  name = sx1262_lora
  
  # ---- LoRa Radio Parameters ----
  # Frequency for your region (Hz)
  # US ISM: 902-928 MHz
  # EU ISM: 863-870 MHz  
  # AU ISM: 915-928 MHz
  frequency = 910525000
  
  # Bandwidth in Hz
  # Common values: 31250, 62500, 125000, 250000
  bandwidth = 62500
  
  # Spreading Factor (7-12)
  # 7 = faster, shorter range (higher data rate)
  # 12 = slower, longer range (lower data rate)
  spreading_factor = 7
  
  # Coding Rate (5-8, meaning 4/5, 4/6, 4/7, 4/8)
  # 5 = best performance, least redundancy
  # 8 = best error correction, most redundancy
  coding_rate = 5
  
  # LoRa Sync Word (helps separate networks)
  # 0x1424 = Private/MeshCore networks (default)
  # 0x3444 = Public LoRaWAN networks
  # Can use any hex value for custom networks
  sync_word = 0x1424
  
  # ---- SPI Configuration ----
  # SPI bus (usually 0 on Raspberry Pi)
  spi_bus = 0
  
  # SPI device (0 = CE0, 1 = CE1, usually 0)
  spi_device = 0
  
  # ---- GPIO Pins (BCM numbering) ----
  # RESET pin
  reset_pin = 18
  
  # BUSY pin (indicates when radio is busy)
  busy_pin = 20
  
  # IRQ pin (interrupt, -1 to disable/use polling)
  irq_pin = -1
  
  # Enable DIO1 IRQ handling instead of pure register polling.
  # If true, the interface will attempt to use the physical IRQ pin.
  # If false, polling remains active as a fallback.
  use_irq = false
  
  # NSS/CS pin (chip select for SPI)
  nss_pin = 21


