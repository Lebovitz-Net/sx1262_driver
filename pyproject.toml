[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sx1262_driver"
version = "0.1.0"
description = "Event-driven SX1262 LoRa driver for Raspberry Pi using lgpio"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gregg A. Lebovitz" }
]
requires-python = ">=3.8"

dependencies = [
  "lgpio",
  "spidev",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
]
keywords = ["sx1262","lora","lgpio","lorawan"]

[project.optional-dependencies]
reticulum = ["rns"]
sideband = ["sbapp"]

[project.scripts]
sx1262-install-rns-interface = "sx1262_driver.install_rns_interface:main"
sx1262-configure-sideband = "sx1262_driver.install_sideband_telemetry:main"

[project.urls]
Homepage = "https://github.com/yourname/sx1262-driver"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["sx1262_driver*"]
